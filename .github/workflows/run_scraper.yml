name: Run Serper Lead Scraper Pipeline

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # - name: 1. Execute Maps Scraper
    #   env:
    #     SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    #   run: python scraper.py

    - name: 2. Execute Website Enrichment
      run: python enrich_leads.py

    - name: 3. Execute Social Scraper
      env:
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      run: python social_scraper.py

    - name: 4. Merge & Deduplicate Datasets
      run: python merge_leads.py

    - name: Commit and Push Master CSV Output
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add *.csv
        git diff-index --quiet HEAD || git commit -m "Automated update: Master Lead List"
        git push
